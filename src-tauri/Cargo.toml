[package]
name = "proxy-dock"
version = "0.1.0"
edition = "2021"
default-run = "proxy-dock"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1" }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate", "derive"] }
chrono = "0.4"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

# Secret storage is OS-backed on every desktop target. Windows talks to
# Credential Manager directly (wincred) because keyring 3.6 silently drops
# writes in some sessions (set Ok, read NoEntry); other OSes keep keyring.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[target.'cfg(not(windows))'.dependencies]
keyring = "3"
